appId: com.davidcantu.materiel
productName: Materiel
copyright: Copyright © 2026 David Cantu
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!docs/*'
  - '!.github/*'
asarUnpack:
  - resources/**
  - '**/*.{node,dll}'
win:
  target:
    - target: nsis
      arch:
        - x64
  executableName: Materiel
nsis:
  artifactName: Materiel-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # Separate arch DMGs (not universal): better-sqlite3-multiple-ciphers ships
  # identical prebuild paths that break @electron/universal merge.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Materiel stores local inventory data and encrypted backups.
    - NSDownloadsFolderUsageDescription: Materiel may export backups to your Downloads folder.
  category: public.app-category.utilities
  notarize: false
dmg:
  artifactName: Materiel-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
  category: Utility
  maintainer: David Cantu
  icon: icons
  # Keep .desktop StartupWMClass aligned with Chromium's app_id / WM_CLASS.
  syncDesktopName: true
appImage:
  artifactName: Materiel-${version}.${ext}
npmRebuild: true
publish:
  provider: github
  owner: davidcantu
  repo: materiel
  releaseType: release
