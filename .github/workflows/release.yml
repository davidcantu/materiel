name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            # Ad-hoc signed DMG + ZIP per arch (see electron-builder.yml mac.identity: "-").
            artifact_glob: 'dist/*.{dmg,zip}'
          - os: windows-latest
            target: win
            artifact_glob: 'dist/*-setup.exe'
          - os: ubuntu-latest
            target: linux
            artifact_glob: 'dist/*.AppImage'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.target }}
        env:
          # No Developer ID / Windows cert in this repo.
          # Mac uses electron-builder mac.identity: "-" (ad-hoc). Keep keychain
          # auto-discovery off so CI never picks a random identity.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:${{ matrix.target }}

      - name: Verify macOS ad-hoc signature and DMG mount
        if: matrix.target == 'mac'
        # macOS runners ship Bash 3.2 — avoid Bash-4-only builtins like mapfile.
        shell: bash
        run: |
          set -euo pipefail
          echo "== Artifacts =="
          ls -la dist/*.{dmg,zip}

          verify_app() {
            local app="$1"
            echo "== codesign -dvv $app =="
            local details
            details="$(codesign -dvv "$app" 2>&1)"
            echo "$details"
            echo "$details" | grep -Eq 'flags=0x[0-9a-f]*\(.*adhoc'
            echo "== codesign --verify --deep $app =="
            codesign --verify --deep "$app"
          }

          app_count=0
          for app in dist/mac-arm64/Materiel.app dist/mac/Materiel.app; do
            if [ -d "$app" ]; then
              verify_app "$app"
              app_count=$((app_count + 1))
            fi
          done
          if [ "$app_count" -eq 0 ]; then
            echo "No Materiel.app found under dist/ for codesign verify" >&2
            find dist -maxdepth 4 -type d -name '*.app' -print || true
            exit 1
          fi
          for dmg in dist/*.dmg; do
            mountpoint="$(mktemp -d /tmp/materiel-dmg.XXXXXX)"
            echo "== hdiutil attach $dmg -> $mountpoint =="
            hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mountpoint"
            ls -la "$mountpoint"
            test -d "$mountpoint/Materiel.app"
            verify_app "$mountpoint/Materiel.app"
            hdiutil detach "$mountpoint"
            rmdir "$mountpoint" || true
          done

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: materiel-${{ matrix.target }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
